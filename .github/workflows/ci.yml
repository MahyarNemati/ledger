name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# NOTE: CGO_ENABLED is deliberately NOT forced to 0 here. The race detector
# requires cgo, and the Linux runners have a working toolchain. Static builds
# set CGO_ENABLED=0 per-step instead.

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Raised from 1.24/1.25 when the modules carrying the security
        # advisories were updated: their own minimum is 1.26, which makes
        # it this project's minimum too. go.mod says the same.
        go: ['1.26', '1.27']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...
      - run: go build ./...
      - name: Test (race)
        env:
          CGO_ENABLED: 1   # the race detector needs cgo
        run: go test -race -count=1 ./...

  invariants:
    name: property-based invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
      # For money, "I tested the cases I thought of" is not an answer, so the
      # invariant suite gets extra generated sequences here.
      - name: Invariants with more generated cases
        env:
          CGO_ENABLED: 1
        # The flag belongs to the rapid package, not to `go test`, so it must
        # come AFTER the package pattern. Before it, `go test` stops parsing
        # and tries to test the root package, which has no Go files.
        run: go test -race -count=1 ./internal/ledger/... -rapid.checks=2000

  integration:
    name: postgres + kafka integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ledger -d ledger"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Start Kafka
        run: |
          docker run -d --name kafka -p 9092:9092 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_AUTO_CREATE_TOPICS_ENABLE=true \
            apache/kafka:3.9.0
          for i in $(seq 1 30); do
            if docker exec kafka /opt/kafka/bin/kafka-broker-api-versions.sh \
                 --bootstrap-server localhost:9092 >/dev/null 2>&1; then
              echo "kafka ready"; break
            fi
            sleep 3
          done

      # The in-memory stores and the Postgres ones share one storetest suite,
      # so this proves the real adapters agree with the fakes the unit tests use.
      - name: Integration tests
        # The -tags=integration guard is what these files are behind; without
        # it they compile out and the job passes while testing nothing.
        env:
          LEDGER_TEST_DATABASE_URL: "postgres://ledger:ledger@localhost:5432/ledger?sslmode=disable"
          LEDGER_TEST_KAFKA_BROKERS: "localhost:9092"
          CGO_ENABLED: 1
        run: go test -race -count=1 -tags=integration ./internal/postgres/... ./internal/kafka/...

      - name: Kafka logs on failure
        if: failure()
        run: docker logs kafka | tail -50

  compose:
    name: full stack comes up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bring up Postgres, Kafka and all three ledger processes
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: API is ready
        run: |
          for i in $(seq 1 30); do
            if curl -fsS localhost:8080/readyz; then echo; exit 0; fi
            sleep 3
          done
          echo "readyz never succeeded"; exit 1
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 80
      - name: Tear down
        if: always()
        run: docker compose down -v

  tidy:
    name: go.mod is tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
      - run: go mod tidy
      - run: git diff --exit-code go.mod go.sum
