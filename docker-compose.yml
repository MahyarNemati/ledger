# The full stack: Postgres (event store + projections + outbox), Kafka, and the
# three ledger processes.
#
# They are separate services on purpose. 'serve' must never block on Kafka
# being reachable, and 'relay' must be restartable without dropping writes —
# that is the whole point of the outbox.
#
#   docker compose up -d --build --wait
#   curl -s localhost:8080/readyz

x-ledger: &ledger
  build: .
  environment: &env
    LEDGER_STORE: postgres
    LEDGER_DATABASE_URL: "postgres://ledger:ledger@postgres:5432/ledger?sslmode=disable"
    LEDGER_KAFKA_BROKERS: "kafka:9092"
    LEDGER_OUTBOX_TOPIC: "ledger.events"
    LEDGER_LOG_FORMAT: text
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
  restart: unless-stopped

services:
  migrate:
    <<: *ledger
    command: ["migrate"]
    restart: "no"

  api:
    <<: *ledger
    command: ["serve"]
    environment:
      <<: *env
      LEDGER_HTTP_ADDR: ":8080"
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  relay:
    <<: *ledger
    command: ["relay"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  consumer:
    <<: *ledger
    command: ["consume"]
    environment:
      <<: *env
      LEDGER_CONSUMER_GROUP: "ledger-activity"
    depends_on:
      kafka:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
